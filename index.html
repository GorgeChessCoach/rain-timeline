<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>Rain Timeline</title>
<link rel="apple-touch-icon" sizes="120x120" href="./rain-icon-v2.png?v=2">
<link rel="icon" type="image/png" href="./rain-icon-v2.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rain Timeline">
<style>
:root{color-scheme:light;--ink:#223045;--muted:#768395;--line:#dce4ec;--blue:#2788c6;--surface:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,540px);margin:0 auto;padding: max(18px,env(safe-area-inset-top)) 19px max(28px,env(safe-area-inset-bottom))}
#status:empty{display:none}#status{min-height:19px;margin:0 0 8px;font-size:12px;color:var(--muted)}
.day{padding:8px 0 27px;border-bottom:0}.day h2{margin:0 0 0;font-size:21px;font-weight:650;letter-spacing:-.035em}.plot{width:100%;height:auto;display:block;overflow:visible}.bar{fill:url(#liquid-fill)}.moisture-grid{fill:#5a9fc9;opacity:.50;animation:moisture-breathe 5.5s ease-in-out infinite}@keyframes moisture-breathe{0%,100%{opacity:.42}50%{opacity:.64}}@media(prefers-reduced-motion:reduce){.moisture-grid{animation:none;opacity:.50}}.axis{fill:#37485b;font-size:13px;font-weight:600}.now{stroke:#bd7c3f;stroke-width:1.3;stroke-dasharray:3 4}nav{display:flex;justify-content:space-between;align-items:center;padding-top:16px;gap:12px}button{font:inherit;font-size:14px;border:1px solid #cad6e1;border-radius:9px;background:white;color:var(--ink);padding:11px 15px;min-height:44px;cursor:pointer}button:disabled{opacity:.28;cursor:default}#page{font-size:12px;color:var(--muted)}footer{padding:28px 0 8px;text-align:center;font-size:11px;color:var(--muted)}footer a{color:inherit}#error{display:none;color:#a33737;font-size:14px;padding:18px 0}.day .empty{color:var(--muted);font-size:12px;position:absolute;left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)}
@media(max-width:360px){main{padding-left:14px;padding-right:14px}.day{padding:17px 0}.day h2{font-size:19px}}
</style>
</head>
<body>
<main>
<p id="status" role="status">Loading forecast…</p>
<div id="days" aria-live="polite"></div>
<p id="error" role="alert"></p>

<footer>Forecast data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Rainfall in inches</footer>
</main>
<script>
(()=>{
'use strict';
const root=document.getElementById('days');const status=document.getElementById('status');const error=document.getElementById('error');

let daily=[];let nextSix=[];let nextSixTimes=[];let hourlySix=[];let hourlySixTimes=[];let ecmwfSix=[];let ecmwfSixTimes=[];
function saveForecast(model,times,values){
 try{
  const key='rain-timeline-forecast-history';
  const history=JSON.parse(localStorage.getItem(key)||'[]');
  if(!Array.isArray(history))return;
  const now=new Date().toISOString();
  history.push({recordedAt:now,model,unit:'inch',times:[...times],precipitation:[...values]});
  const cutoff=Date.now()-45*86400000;
  const recent=history.filter(item=>Date.parse(item.recordedAt)>=cutoff).slice(-600);
  localStorage.setItem(key,JSON.stringify(recent));
 }catch(e){console.warn('Forecast history could not be saved:',e)}
}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function nameOf(date){const [y,m,d]=date.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)))}
function plot(hours,isToday,scale,sunrise,sunset){
const width=357.4/23,left=1.3-width/2,right=left+24*width,top=12,height=8*width,bottom=27+height;
const hoursOfDay=time=>{const m=/T(\d{2}):(\d{2})/.exec(time||'');return m?Number(m[1])+Number(m[2])/60:null};
const rise=hoursOfDay(sunrise),set=hoursOfDay(sunset);
let pieces=[];
if(rise!==null&&set!==null){for(const [start,end] of [[0,rise],[set,24]]){if(end>start){const x1=Math.max(left+width/2-1.3,left+start*width),x2=Math.min(right-width/2+1.3,left+end*width);if(x2>x1)pieces.push(`<rect x="${x1.toFixed(2)}" y="${(bottom-height-1.3).toFixed(2)}" width="${(x2-x1).toFixed(2)}" height="${(height+2.6).toFixed(2)}" fill="#7293ad" opacity=".09"/>`)}}}
for(let row=0;row<=8;row++){const y=bottom-row*height/8;for(let col=0;col<24;col++){const x=left+(col+0.5)*width;pieces.push(`<circle class="moisture-grid" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.3"/>`)}}
for(let i=0;i<24;i++){const amount=Math.max(0,Number(hours[i])||0),h=Math.min(height,amount/scale*height);if(amount>0){pieces.push(`<rect class="bar" x="${(left+i*width+1).toFixed(2)}" y="${(bottom-h+1.3).toFixed(2)}" width="${(width-2).toFixed(2)}" height="${Math.max(1.5,h).toFixed(2)}" rx="${Math.min((width-2)/2,Math.max(1.5,h)/2).toFixed(2)}"><title>${i===0?'12 AM':i<12?i+' AM':i===12?'12 PM':(i-12)+' PM'}: ${amount.toFixed(3)} inches forecast</title></rect>`)}}
for(const [hour,label] of [[3,'3a'],[6,'6a'],[9,'9a'],[12,'12p'],[15,'3p'],[18,'6p'],[21,'9p']]){pieces.push(`<text class="axis" x="${left+hour*width}" y="${(bottom+21).toFixed(2)}" text-anchor="${hour===0?'start':hour===24?'end':'middle'}">${label}</text>`)}
if(isToday){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());const h=Number(parts.find(p=>p.type==='hour').value)%24,m=Number(parts.find(p=>p.type==='minute').value);const x=left+(h+m/60)*width,y=bottom+1.3;pieces.push(`<polygon points="${(x-4.62).toFixed(2)},${y.toFixed(2)} ${(x+4.62).toFixed(2)},${y.toFixed(2)} ${x.toFixed(2)},${(y+8.03).toFixed(2)}" fill="#e3bf37"/>`)}
return `<svg class="plot" viewBox="0 0 360 ${Math.ceil(bottom+29)}" role="img" aria-label="Hourly precipitation forecast in inches, midnight to midnight"><defs><linearGradient id="liquid-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c5e8"/><stop offset="0.48" stop-color="#2788c6"/><stop offset="1" stop-color="#2788c6"/></linearGradient></defs>${pieces.join('')}</svg>`}
function plotSix(values,times){
const width=357.4/23,left=1.3-width/2,height=8*width,bottom=27+height;
const startX=left+3*width,quarterWidth=18*width/24,leftEdge=left+width/2-1.3,rightEdge=left+23.5*width+1.3;
const timeHours=time=>{const match=/T(\d{2}):(\d{2})/.exec(time||'');return match?Number(match[1])+Number(match[2])/60:null};
const first=timeHours(times[0]);
const parts=[];
if(first!==null){
  for(let i=0;i<24;i++){
    const date=times[i]?.slice(0,10);
    const sunEntry=daily.find(d=>d.date===date);
    const rise=timeHours(sunEntry?.sunrise),set=timeHours(sunEntry?.sunset);
    const hour=timeHours(times[i]);
    if(hour!==null&&rise!==null&&set!==null&&(hour<rise||hour>=set))
      parts.push(`<rect x="${(i===0?leftEdge:startX+i*quarterWidth).toFixed(2)}" y="${(bottom-height-1.3).toFixed(2)}" width="${(i===23?rightEdge-(i===0?leftEdge:startX+i*quarterWidth):i===0?startX+quarterWidth-leftEdge:quarterWidth).toFixed(2)}" height="${(height+2.6).toFixed(2)}" fill="#7293ad" opacity=".09"/>`);
  }
}
for(let row=0;row<=8;row++)for(let col=0;col<24;col++){
 const x=left+(col+.5)*width,y=bottom-row*width;
 parts.push(`<circle class="moisture-grid" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.3"/>`);
}
const max=Math.max(.025,...values);
for(let i=0;i<24;i++){
 const val=Number(values[i])||0,h=Math.min(height,Math.max(0,val)/max*height);
 if(val>0)parts.push(`<rect class="bar" x="${(startX+i*quarterWidth+0.5).toFixed(2)}" y="${(bottom-h+1.3).toFixed(2)}" width="${(quarterWidth-1).toFixed(2)}" height="${(Math.max(1.5,h)+1.3).toFixed(2)}" rx="${Math.min((quarterWidth-1)/2,Math.max(1.5,h)/2).toFixed(2)}"><title>${times[i]}: ${val.toFixed(3)} inches forecast</title></rect>`);
}
const startMinutes=Number(times[0].slice(11,13))*60+Number(times[0].slice(14,16));
for(let i=0;i<=6;i++){
 const total=(startMinutes+i*60)%1440,h=Math.floor(total/60),m=total%60;
 const label=((h%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?'a':'p');
 const x=left+(3+i*3)*width;
 parts.push(`<text class="axis" x="${x.toFixed(2)}" y="${(bottom+21).toFixed(2)}" text-anchor="middle">${label}</text>`);
}
return `<svg class="plot" viewBox="0 0 360 ${Math.ceil(bottom+29)}" role="img" aria-label="Precipitation forecast for the next six hours, in 15 minute intervals"><defs><linearGradient id="liquid-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c5e8"/><stop offset="0.48" stop-color="#2788c6"/><stop offset="1" stop-color="#2788c6"/></linearGradient></defs>${parts.join('')}</svg>`;
}
function render(){
if(!daily.length)return;
const chosen=daily,max=Math.max(.025,...daily.flatMap(d=>d.hours));
const sixA=nextSix.length===24?`<section class="day"><h2>Meteo 15</h2>${plotSix(nextSix,nextSixTimes)}</section>`:'';
const sixB=hourlySix.length===24?`<section class="day"><h2>Meteo 60</h2>${plotSix(hourlySix,hourlySixTimes)}</section>`:'';
const sixC=ecmwfSix.length===24?`<section class="day"><h2>ECMWF</h2>${plotSix(ecmwfSix,ecmwfSixTimes)}</section>`:'';
root.innerHTML='<div>'+sixA+sixB+sixC+chosen.slice(1).map((d,i)=>`<section class="day"><h2>${escapeHTML(d.date===localToday()?'Today':nameOf(d.date)+(i>=6?' '+Number(d.date.slice(5,7))+'/'+Number(d.date.slice(8,10)):''))}</h2>${plot(d.hours,d.date===localToday(),max,d.sunrise,d.sunset)}</section>`).join('')+'</div>';

}
async function loadECMWF(){
try{
 const url='https://api.open-meteo.com/v1/ecmwf?latitude=45.7054&longitude=-121.5215&hourly=precipitation&models=ecmwf_ifs&precipitation_unit=inch&timezone=America%2FLos_Angeles';
 const response=await fetch(url);if(!response.ok)throw new Error('ECMWF forecast unavailable');
 const data=await response.json(),times=data.hourly?.time,amounts=data.hourly?.precipitation;
 if(!Array.isArray(times)||!Array.isArray(amounts)||!hourlySixTimes.length)throw new Error('ECMWF forecast incomplete');
 const firstHour=hourlySixTimes[0].slice(0,13)+':00';
 const start=times.indexOf(firstHour);
 if(start<0||start+6>amounts.length)throw new Error('ECMWF time window unavailable');
 ecmwfSix=[];ecmwfSixTimes=[];
 for(let h=0;h<6;h++)for(let q=0;q<4;q++){
  ecmwfSixTimes.push(times[start+h].slice(0,14)+String(q*15).padStart(2,'0'));
  ecmwfSix.push(amounts[start+h]??0);
 }
 saveForecast('ECMWF',ecmwfSixTimes,ecmwfSix);
 render();
}catch(e){console.warn('ECMWF forecast unavailable:',e)}
}
async function loadSix(){
try{
 const url='https://api.open-meteo.com/v1/forecast?latitude=45.7054&longitude=-121.5215&minutely_15=precipitation&precipitation_unit=inch&timezone=America%2FLos_Angeles&past_minutely_15=4&forecast_minutely_15=28';
 const response=await fetch(url);if(!response.ok)throw new Error('15-minute forecast unavailable');
 const data=await response.json(),times=data.minutely_15?.time,vals=data.minutely_15?.precipitation;
 if(!Array.isArray(times)||!Array.isArray(vals)||times.length<24||vals.length<24)throw new Error('Insufficient 15-minute forecast');
 // API 15-minute timestamps denote the end of their precipitation period.
 const now=new Date();const getPart=(type)=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now).find(p=>p.type===type)?.value;
 const nowLocal=`${getPart('year')}-${getPart('month')}-${getPart('day')}T${getPart('hour')==='24'?'00':getPart('hour')}:${getPart('minute')}`;
 const start=times.findIndex(t=>t>=nowLocal.slice(0,13)+':00');
 if(start<0||times.length-start<24)throw new Error('Not enough future quarter-hours');
 nextSixTimes=times.slice(start,start+24);nextSix=vals.slice(start,start+24);saveForecast('Meteo 15',nextSixTimes,nextSix);render();
}catch(error){console.warn('Six-hour forecast unavailable:',error)}
}
async function load(){
try{
const url='https://api.open-meteo.com/v1/forecast?latitude=45.7054&longitude=-121.5215&hourly=precipitation&daily=sunrise%2Csunset&precipitation_unit=inch&timezone=America%2FLos_Angeles&forecast_days=11';
const response=await fetch(url);if(!response.ok)throw new Error('Forecast service unavailable');const json=await response.json();
const times=json.hourly?.time,amounts=json.hourly?.precipitation;
if(!Array.isArray(times)||!Array.isArray(amounts)||times.length!==amounts.length)throw new Error('Forecast data incomplete');
const grouped=new Map();for(let i=0;i<times.length;i++){const day=times[i].slice(0,10),hour=Number(times[i].slice(11,13));if(!grouped.has(day))grouped.set(day,Array(24).fill(0));if(hour>=0&&hour<=23)grouped.get(day)[hour]=amounts[i]??0}
const sunTimes=new Map((json.daily?.time||[]).map((date,i)=>[date,{sunrise:json.daily.sunrise?.[i],sunset:json.daily.sunset?.[i]}]));
daily=[...grouped].map(([date,hours])=>({date,hours,...sunTimes.get(date)})).slice(0,11);
const nowParts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date());
const part=k=>nowParts.find(p=>p.type===k)?.value;
const currentHour=`${part('year')}-${part('month')}-${part('day')}T${part('hour')==='24'?'00':part('hour')}:00`;
const start=times.findIndex(t=>t===currentHour);
hourlySix=[];hourlySixTimes=[];
if(start>=0&&start+6<times.length){
  for(let h=0;h<6;h++)for(let q=0;q<4;q++){
    hourlySixTimes.push(times[start+h].slice(0,14)+String(q*15).padStart(2,'0'));
    hourlySix.push(amounts[start+h]??0);
  }
}
if(daily.length<3)throw new Error('Not enough forecast days');
if(hourlySix.length===24)saveForecast('Meteo 60',hourlySixTimes,hourlySix);
status.textContent='';render();
loadSix();
loadECMWF();
}catch(e){status.textContent='';error.textContent='Unable to load the live forecast. Please check your internet connection and reload.';error.style.display='block';console.error(e)}
}
let lastRefresh=Date.now();
function refreshOnReturn(){
 if(Date.now()-lastRefresh<1500)return;
 lastRefresh=Date.now();
 load();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOnReturn()});
window.addEventListener('pageshow',event=>{if(event.persisted)refreshOnReturn()});
load();
})();
</script>
</body>
</html>
