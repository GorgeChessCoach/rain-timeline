<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>Rain Timeline</title>
<link rel="apple-touch-icon" sizes="120x120" href="./rain-icon.png?v=1">
<link rel="icon" type="image/png" href="./rain-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rain Timeline">
<style>
:root{color-scheme:light;--ink:#223045;--muted:#768395;--line:#dce4ec;--blue:#2788c6;--surface:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,540px);margin:0 auto;padding: max(18px,env(safe-area-inset-top)) 19px max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;min-height:45px;margin-bottom:6px}header .place{font-size:13px;letter-spacing:.025em;color:var(--muted)}h1{font-size:18px;font-weight:650;letter-spacing:-.025em;margin:0}#status{min-height:19px;margin:0 0 8px;font-size:12px;color:var(--muted)}
.day{padding:20px 0 21px;border-bottom:1px solid var(--line)}.day:last-of-type{border-bottom:0}.day h2{margin:0 0 4px;font-size:21px;font-weight:650;letter-spacing:-.035em}.plot{width:100%;height:auto;display:block;overflow:visible}.bar{fill:var(--blue)}.moisture-grid{fill:#5a9fc9;opacity:.37;animation:moisture-breathe 5.5s ease-in-out infinite}@keyframes moisture-breathe{0%,100%{opacity:.29}50%{opacity:.52}}@media(prefers-reduced-motion:reduce){.moisture-grid{animation:none;opacity:.37}}.axis{fill:var(--muted);font-size:11px}.now{stroke:#bd7c3f;stroke-width:1.3;stroke-dasharray:3 4}nav{display:flex;justify-content:space-between;align-items:center;padding-top:16px;gap:12px}button{font:inherit;font-size:14px;border:1px solid #cad6e1;border-radius:9px;background:white;color:var(--ink);padding:11px 15px;min-height:44px;cursor:pointer}button:disabled{opacity:.28;cursor:default}#page{font-size:12px;color:var(--muted)}footer{padding:28px 0 8px;text-align:center;font-size:11px;color:var(--muted)}footer a{color:inherit}#error{display:none;color:#a33737;font-size:14px;padding:18px 0}.day .empty{color:var(--muted);font-size:12px;position:absolute;left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)}
@media(max-width:360px){main{padding-left:14px;padding-right:14px}.day{padding:17px 0}.day h2{font-size:19px}}
</style>
</head>
<body>
<main>
<header><h1>Rain</h1><span class="place">Hood River, Oregon</span></header>
<p id="status" role="status">Loading forecast…</p>
<div id="days" aria-live="polite"></div>
<p id="error" role="alert"></p>

<footer>Forecast data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Rainfall in inches</footer>
</main>
<script>
(()=>{
'use strict';
const root=document.getElementById('days');const status=document.getElementById('status');const error=document.getElementById('error');

let daily=[];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function nameOf(date){const [y,m,d]=date.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)))}
function plot(hours,isToday,scale){
const left=4,right=356,top=12,bottom=119,width=(right-left)/24,height=92;
let pieces=[];
for(let row=0;row<=8;row++){const y=bottom-row*height/8;for(let col=0;col<=24;col++){const x=left+col*width;pieces.push(`<circle class="moisture-grid" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".82"/>`)}}
for(let i=0;i<24;i++){const amount=Math.max(0,Number(hours[i])||0),h=Math.min(height,amount/scale*height);if(amount>0){pieces.push(`<rect class="bar" x="${(left+i*width+1).toFixed(2)}" y="${(bottom-h).toFixed(2)}" width="${(width-2).toFixed(2)}" height="${Math.max(1.5,h).toFixed(2)}" rx="1.5"><title>${i===0?'12 AM':i<12?i+' AM':i===12?'12 PM':(i-12)+' PM'}: ${amount.toFixed(3)} inches forecast</title></rect>`)}}
for(const [hour,label] of [[0,'12 AM'],[6,'6 AM'],[12,'Noon'],[18,'6 PM'],[24,'12 AM']]){pieces.push(`<text class="axis" x="${left+hour*width}" y="140" text-anchor="${hour===0?'start':hour===24?'end':'middle'}">${label}</text>`)}
if(isToday){const t=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',hour12:false}).format(new Date()),hour=Number(t)%24;pieces.push(`<line class="now" x1="${left+hour*width}" y1="${top}" x2="${left+hour*width}" y2="${bottom}"/>`)}
return `<svg class="plot" viewBox="0 0 360 148" role="img" aria-label="Hourly precipitation forecast in inches, midnight to midnight">${pieces.join('')}</svg>`}
function render(){
if(!daily.length)return;
const chosen=daily,max=Math.max(.025,...daily.flatMap(d=>d.hours));
root.innerHTML='<div>'+chosen.map(d=>`<section class="day"><h2>${escapeHTML(d.date===localToday()?'Today':nameOf(d.date))}</h2>${plot(d.hours,d.date===localToday(),max)}</section>`).join('')+'</div>';

}
async function load(){
try{
const url='https://api.open-meteo.com/v1/forecast?latitude=45.7054&longitude=-121.5215&hourly=precipitation&precipitation_unit=inch&timezone=America%2FLos_Angeles&forecast_days=11';
const response=await fetch(url);if(!response.ok)throw new Error('Forecast service unavailable');const json=await response.json();
const times=json.hourly?.time,amounts=json.hourly?.precipitation;
if(!Array.isArray(times)||!Array.isArray(amounts)||times.length!==amounts.length)throw new Error('Forecast data incomplete');
const grouped=new Map();for(let i=0;i<times.length;i++){const day=times[i].slice(0,10),hour=Number(times[i].slice(11,13));if(!grouped.has(day))grouped.set(day,Array(24).fill(0));if(hour>=0&&hour<=23)grouped.get(day)[hour]=amounts[i]??0}
daily=[...grouped].map(([date,hours])=>({date,hours})).slice(0,11);
if(daily.length<3)throw new Error('Not enough forecast days');
status.textContent='';render();
}catch(e){status.textContent='';error.textContent='Unable to load the live forecast. Please check your internet connection and reload.';error.style.display='block';console.error(e)}
}
load();
})();
</script>
</body>
</html>
